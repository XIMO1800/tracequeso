// ═══════════════════════════════════════════════════════════════════════════
// (v25) CORREGIR REGISTROS — limpieza de envasados viejos (Joaquín, 31/10).
// Tres listas; se marca lo que está mal y se corrige de una vez, con el mismo
// envío de edición que usa Calidad en TraceQueso (ID + _UPDATE: solo cambian
// las casillas que se mandan; queda anotado quién lo hizo).
//   1) Envasados guardados con un ID que no es de palé (lote + 00 + formato +
//      piezas, o el lote tecleado como ID) → pasan a «sin QR»: ID vacío y el
//      lote (largo!corto) en LOTE QUESO.
//   2) Envasados sin QR con sala puesta (la cogían de otro queso) → sala vacía.
//   3) Envasados con lote de manteca/romero/finas hierbas/pimienta → se quitan
//      los que se marquen (los que el queso no llevaba).
// ═══════════════════════════════════════════════════════════════════════════
var RV={tab:'ids', sel:{}, desde:'', hasta:''};
var CONDS=[['LOTE MANTECA','manteca'],['LOTE ROMERO','romero'],['LOTE FINAS HIERBAS','finas hierbas'],['LOTE PIMIENTA','pimienta']];
function esSinQR(r){ var id=pidDe(r); return !/\d{6}/.test(id.replace(/\s/g,'')) || idInventado(id); }
function loteDeId(r){
  var id=pidDe(r), i=parsearId(id), corto=i.loteCorto.replace(/^L-?/i,'').trim();
  var largo=(i.dig||'').length>=12 ? i.lote : id.split('*')[0].split('!')[0].replace(/\s/g,'');
  var actual=String(r['LOTE QUESO']||'').trim();
  var base=actual||largo;
  if(corto && nrm(base).split(/[!\s]+/).indexOf(nrm(corto))<0) base=base+'!'+corto;
  return base;
}
function rvListas(){
  function enFecha(r){ var f=r.__f?isoDia(r.__f):''; return !(RV.desde && f<RV.desde) && !(RV.hasta && f>RV.hasta); }
  var env=ROWS.filter(function(r){ return secDe(r)==='ENVASADO' && enFecha(r); }).sort(function(a,b){ return b.__t-a.__t; });
  // Los IDs inventados salen también en PINTURA (el registro manual se los inventaba).
  var envPint=ROWS.filter(function(r){ var s=secDe(r); return (s==='ENVASADO'||s==='PINTURA') && enFecha(r); }).sort(function(a,b){ return b.__t-a.__t; });
  return {
    ids: envPint.filter(function(r){ var id=pidDe(r); return id && /\d{4}/.test(id) && idInventado(id); }),
    sala: env.filter(function(r){ return esSinQR(r) && (String(r['SALA ORIGEN']||'').trim() || String(r['SALA DESTINO']||'').trim()); }),
    cond: env.filter(function(r){ return CONDS.some(function(c){ return String(r[c[0]]||'').trim(); }); })
  };
}

           cond:'Envasados con lote de <b>manteca, romero, finas hierbas o pimienta</b>. Hasta la v495 se ponían solos aunque el queso no los llevara. <b>Marca solo los que NO llevaba</b> ese queso: se borrará ese lote.'}[RV.tab];
  h+='<div class="aviso" style="background:#fff;border-color:var(--line);color:var(--ink)">'+txt+'</div>'
    +'<div class="filt"><label>Desde<input type="date" id="rv-desde" value="'+esc(RV.desde)+'"></label><label>Hasta<input type="date" id="rv-hasta" value="'+esc(RV.hasta)+'"></label>'
    +'<button class="btn" id="rv-todos">Marcar todos</button><button class="btn" id="rv-ninguno">Desmarcar</button><div style="flex:1"></div>'
    +'<span id="rv-cnt" style="font-weight:700;color:var(--brand)"></span><button class="btn pri" id="rv-ok">Corregir lo marcado</button></div><div class="tbl-wrap" id="rv-tbl" style="max-height:none"></div>';
  $('cont').innerHTML=h;
  document.querySelectorAll('#cont .tabs button').forEach(function(b){ b.onclick=function(){ RV.tab=b.getAttribute('data-rt'); RV.sel={}; vistaRevision(); }; });
  $('rv-desde').onchange=function(){ RV.desde=this.value; RV.sel={}; vistaRevision(); };
  $('rv-hasta').onchange=function(){ RV.hasta=this.value; RV.sel={}; vistaRevision(); };
  var lista=L[RV.tab]; RV._lista=lista;
  if(!lista.length){ $('rv-tbl').innerHTML='<div class="vacio">No hay nada que corregir aquí. 👍</div>'; rvCnt(); return; }
  var t='<table><thead><tr><th></th><th>Fecha</th>'+(RV.tab==='ids'?'<th>Sección</th>':'')+'<th>Operario</th><th>ID guardado</th><th>Lote queso</th><th>Tipo · formato</th><th style="text-align:right">Pzas</th>';
  if(RV.tab==='ids') t+='<th>Quedará como</th>';
  if(RV.tab==='sala') t+='<th>Sala puesta</th>';
  if(RV.tab==='cond') t+='<th>Lotes de condimento (marca los que NO llevaba)</th>';
  t+='</tr></thead><tbody>';
  lista.forEach(function(r,i){
    var k=String(r['ID']||i);
    t+='<tr class="nolink">';
    if(RV.tab==='cond'){
      t+='<td></td>';
    } else t+='<td><input type="checkbox" class="rv-ck" data-k="'+esc(k)+'"'+(RV.sel[k]?' checked':'')+'></td>';
    t+='<td>'+fDia(r.__f)+'</td>'+(RV.tab==='ids'?'<td>'+esc(secDe(r))+'</td>':'')+'<td>'+esc(r['OPERARIO'])+'</td><td class="mono">'+esc(pidDe(r)||'—')+'</td><td class="mono">'+esc(r['LOTE QUESO'])+'</td>'
      +'<td>'+esc([r['TIPO DE QUESO'],r['VARIEDAD'],r['FORMATO/PESO']].filter(Boolean).join(' · '))+'</td><td class="num">'+esc(r['Nº DE PIEZAS'])+'</td>';
    if(RV.tab==='ids') t+='<td>sin QR · lote <b class="mono">'+esc(loteDeId(r))+'</b></td>';
    if(RV.tab==='sala') t+='<td>'+esc(sl(r['SALA ORIGEN']))+(String(r['SALA DESTINO']||'')!==String(r['SALA ORIGEN']||'')?' → '+esc(sl(r['SALA DESTINO'])):'')+'</td>';
    if(RV.tab==='cond') t+='<td style="white-space:normal">'+CONDS.filter(function(c){ return String(r[c[0]]||'').trim(); }).map(function(c){ var kk=k+'|'+c[0];
        return '<label class="rv-cd"><input type="checkbox" class="rv-ck" data-k="'+esc(kk)+'"'+(RV.sel[kk]?' checked':'')+'> '+esc(c[1])+' <span class="mono">'+esc(r[c[0]])+'</span></label>'; }).join(' ')+'</td>';
    t+='</tr>';
  });
  $('rv-tbl').innerHTML=t+'</tbody></table>';
  $('rv-tbl').onchange=function(ev){ var c=ev.target.closest('.rv-ck'); if(!c) return; if(c.checked) RV.sel[c.getAttribute('data-k')]=1; else delete RV.sel[c.getAttribute('data-k')]; rvCnt(); };
  $('rv-todos').onclick=function(){ document.querySelectorAll('#rv-tbl .rv-ck').forEach(function(c){ c.checked=true; RV.sel[c.getAttribute('data-k')]=1; }); rvCnt(); };
  $('rv-ninguno').onclick=function(){ RV.sel={}; document.querySelectorAll('#rv-tbl .rv-ck').forEach(function(c){ c.checked=false; }); rvCnt(); };
  $('rv-ok').onclick=rvAplicar;
  rvCnt();
}
function rvCnt(){ var n=Object.keys(RV.sel).length; if($('rv-cnt')) $('rv-cnt').textContent=n?(n+' marcado'+(n>1?'s':'')):''; }
function rvAplicar(){
  if(soloMirar()) return;
  var porId={}, lista=RV._lista||[];
  lista.forEach(function(r,i){ porId[String(r['ID']||i)]=r; });
  var cambios=[];   // {r, set:{col:val}}
  Object.keys(RV.sel).forEach(function(k){
    var p=k.split('|'), r=porId[p[0]]; if(!r || !r['ID']) return;
    var c=cambios.filter(function(x){ return x.r===r; })[0]; if(!c){ c={r:r, set:{}}; cambios.push(c); }
    if(RV.tab==='ids'){ c.set['LOTE QUESO']=loteDeId(r); c.set['ID PALET']=''; }
    else if(RV.tab==='sala'){ c.set['SALA ORIGEN']=''; c.set['SALA DESTINO']=''; }
    else if(p[1]) c.set[p[1]]='';
  });
  if(!cambios.length){ alert('No hay nada marcado.'); return; }
  if(!confirm('Se van a corregir '+cambios.length+' registro'+(cambios.length>1?'s':'')+' en la hoja (REGISTRO TOTAL).\n\nQueda anotado que lo has hecho tú. ¿Seguir?')) return;
  var b=$('rv-ok'); b.disabled=true;
  var hechos=0, fallos=0, i=0;
  (function sig(){
    if(i>=cambios.length){
      b.disabled=false; RV.sel={};
      alert('Hecho: '+hechos+' corregido'+(hechos===1?'':'s')+(fallos?(' · '+fallos+' NO se han podido corregir (vuelve a intentarlo)'):'')+'.');
      vistaRevision(); return;
    }
    var c=cambios[i++]; b.textContent='Corrigiendo '+i+' de '+cambios.length+'…';
    var pay=Object.assign({ID:c.r['ID'], _UPDATE:true, _QUIEN:(CU&&CU.n)||''}, c.set);
    fetch(API_URL,{method:'POST', body:JSON.stringify(pay)}).then(function(x){ return x.json(); }).then(function(j){
      if(j && j.ok){ hechos++; Object.keys(c.set).forEach(function(k){ c.r[k]=c.set[k]; }); _invC=null; } else fallos++;
    }).catch(function(){ fallos++; }).then(function(){ guardarCopia(); sig(); });
  })();
}

    $('bloq').hidden=false; return;

    $('bloq-m').innerHTML='La versión de oficina está en pruebas y de momento solo la usan Joaquín y Calidad.<br>Sigue trabajando en TraceQueso como siempre.';
    $('bloq').hidden=false; return;
  }
  $('app').hidden=false;
  $('t-who').textContent=nombre;
  $('s-ver').textContent=VER+(puedeGuardar()?' · en pruebas':' · en pruebas · solo mirar');
  try{ var v=localStorage.getItem('tqof_vista'); if(['registros','mat','traz','trazq','trazinv','pale','revision'].indexOf(v)>=0) VISTA=v; }catch(e){}
  pintarMenu();

  $('b-act').onclick=function(){ ponerAlDia(); };
